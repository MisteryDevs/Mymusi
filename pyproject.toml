[project]
name = "music"
version = "3.0.3"
description = "A powerful Telegram Music Bot for Group Voice Chats, supporting high-quality audio and video streaming."
readme = ".github/README.md"
requires-python = ">=3.10"
keywords = ["telegram", "muic-bot", "voice-chat", "python", "pyrogram", "uh-music"]

dependencies = [
    "aiohttp~=3.14.0",
    "kurigram>=2.2.21",
    "pillow>=12.2,<12.4",
    "psutil~=7.2.2",
    "py-tgcalls~=2.3.3",
    "py-yt-search>=0.6.2,<0.8.0",
    "pymongo>=4.16.0",
    "pytgcrypto>=1.2.11",
    "python-dotenv~=1.2.1",
    "yt-dlp[default]>=2026.3.17",
]

[project.urls]
Homepage = "https://github.com/MisteryDevs/Mymusi"
Repository = "https://github.com/MisteryDevs/Mymusi"
